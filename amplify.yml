# AWS Amplify Hosting build settings (static deploy).
# Amplify serves the prerendered files in dist/ directly — server.js is NOT used here.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci
        # Chromium is needed for the post-build prerender step.
        - npx playwright install --with-deps chromium || npx playwright install chromium
        # Ensure VITE_SITE_URL is set so canonical URLs, OG tags, sitemap, robots
        # are baked with the real site URL — never a placeholder.
        - export VITE_SITE_URL="${VITE_SITE_URL:-https://main.d3qo2lelzu6w5v.amplifyapp.com}"
        - echo "Building with VITE_SITE_URL=$VITE_SITE_URL"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - $HOME/.cache/ms-playwright/**/*
